[package]
name = "lamquant-op-event-legacy"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["QuiteTall <briankhanglam@gmail.com>"]
description = "Legacy compatibility OpEvent protocol crate preserved for retired OpEvent wire format. Do not use for new code."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"
homepage = "https://github.com/Quitetall/LamQuant"
readme = "README.md"
keywords = ["eeg", "lamquant", "ipc", "codec"]
categories = ["science", "encoding"]
publish = false

[lib]
name = "lamquant_ops_legacy"
path = "src/lib.rs"

[dependencies]
# Tiny, dep-free JSON serializer for OpEvent line emission. Pulled from the
# host workspace so we don't add a new transitive dep.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"

[dev-dependencies]
# Schema parity test reads the canonical JSON Schema and validates a fixture.
jsonschema = { version = "0.30", default-features = false }

[lints.clippy]
# Preserve source bytes from the retired revision. Current Clippy newly reports
# one nested test match that was accepted by the source toolchain.
collapsible_match = "allow"
