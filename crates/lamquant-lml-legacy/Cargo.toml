[package]
# LamQuant LML — the LEGACY v1 wire (ADR 0069 L3/L4). Sequesters the
# structurally-suboptimal old container/wire scaffolding so the clean ABIR path
# (lamquant-lossless) grows cruft-free. The kernels (lifting/lpc/golomb/rans) +
# hardening stay in lamquant-lml-mcu and are CALLED from here; only the old
# scaffolding lives in this crate. Host-only (the v1 container is std-bound;
# firmware never decodes v1 *containers*, only per-window packets via the kernel).
name = "lamquant-lml-legacy"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
description = "LamQuant LML — LEGACY v1 wire (ADR 0069): the sequestered old container/wire behind features — legacy-decode (the FROZEN v1 reader, old .lml/.lma decode forever) and legacy-encode (the retiring differential-oracle encoder). Kernels + hardening stay in lamquant-lml-mcu."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"

[lib]
name = "lamquant_lml_legacy"
crate-type = ["rlib"]

[features]
# The FROZEN v1 DECODER — default ON forever (old .lml/.lma must decode).
default = ["legacy-decode", "legacy-tensor-pack"]
legacy-decode = []
# The RETIRED LQTP2/LQTP3 training snapshot wires (ADR 0143/0144). Default ON:
# the legacy adapter must be able to open them, exactly as with old containers.
legacy-tensor-pack = ["dep:lamquant-lml-archive", "dep:memmap2", "dep:sha2", "dep:zstd"]
# The retiring v1 ENCODER — the differential ORACLE; demoted out of default at cutover,
# kept gated for Step-B forensics, deletable only after Step B ships its own goldens.
legacy-encode = ["legacy-decode", "dep:lamquant-lml-desktop"]

[dependencies]
# Kernels + error/lml/lpc/deployment/crc32 — the proven core, CALLED not moved.
lamquant-lml-mcu.workspace = true
# The v1 container's parallel encode path lives in the Desktop tier; the
# legacy writer dispatches through its byte-equal backend interface.
lamquant-lml-desktop = { workspace = true, optional = true }
# The v1 metadata JSON (`metadata_with_codec_mode`).
serde_json = { version = "1", features = ["std"] }
# LQTP1 supplies the block-floating-point row codec LQTP2/LQTP3 reuse.
lamquant-lml-archive = { workspace = true, optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
zstd = { version = "0.13", optional = true }

# The retired packs open snapshots with O_NOFOLLOW and rename them with
# renameat2(RENAME_NOREPLACE); both are Unix syscalls with no portable stand-in.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The moved container/stream tests write to temp files.
tempfile = "3"
# The LQTP3 wire test back-dates a snapshot to prove open-time verification
# does not depend on wall-clock ordering.
filetime = "0.2"
# The retired tensor-pack wire tests digest snapshot bytes; the byte-equality
# example digests encoded payloads.
sha2 = "0.10"

# ADR 0139 P3 compute evidence: needs the Desktop tier for both backends.
[[example]]
name = "backend_byte_equality"
required-features = ["legacy-encode"]
