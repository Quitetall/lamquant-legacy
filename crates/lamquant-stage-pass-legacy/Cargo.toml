[package]
name = "lamquant-stage-pass-legacy"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"
publish = false
description = "Process-isolated facade for LamQuant's retired Stage and Pass API"

[dependencies]
lamquant-lml-archive = { path = "../../../codec-lossless/lamquant-lossless", package = "lamquant-lml", default-features = false, features = ["std", "archive"] }

[workspace]
resolver = "2"
