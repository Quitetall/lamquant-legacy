[workspace]
resolver = "2"
members = [
    "crates/lamquant-abir-bridge",
    "crates/lamquant-legacy-adapter",
    "crates/lamquant-legacy-ir",
    "crates/lamquant-lml-legacy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"

[workspace.dependencies]
abir = { path = "../abir/crates/abir", version = "=0.1.0" }
abir-adapter = { path = "../abir/crates/abir-adapter", version = "=0.1.0" }
blake3 = { version = "=1.5.5", default-features = false }
bytemuck = "=1.25.0"
lamquant-legacy-ir = { path = "crates/lamquant-legacy-ir", version = "=0.1.1" }
lamquant-lml-legacy = { path = "crates/lamquant-lml-legacy", version = "=0.1.1", default-features = false, features = ["legacy-decode", "legacy-encode"] }
lamquant-lml-mcu = { path = "../codec-lossless/lamquant-lml-mcu", version = "=0.9.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
