[workspace]
resolver = "2"
members = [
    "crates/lamquant-abir-bridge",
    "crates/lamquant-legacy-adapter",
    "crates/lamquant-legacy-ir",
    "crates/lamquant-lml-legacy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"

[workspace.dependencies]
abir = { git = "https://github.com/Quitetall/ABIR.git", rev = "5fb448361e762f5ae17f9b760be16f40632cd1f3", version = "=0.1.0" }
abir-adapter = { git = "https://github.com/Quitetall/ABIR.git", rev = "5fb448361e762f5ae17f9b760be16f40632cd1f3", version = "=0.1.0" }
blake3 = { version = "=1.5.5", default-features = false }
bytemuck = "=1.25.0"
lamquant-legacy-ir = { path = "crates/lamquant-legacy-ir", version = "=0.1.1" }
lamquant-lml-legacy = { path = "crates/lamquant-lml-legacy", version = "=0.1.1", default-features = false, features = ["legacy-decode", "legacy-encode"] }
lamquant-lml-desktop = { git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "1c377f2afe8c3f13ebd6c1c4421bf78a2c2877e5", version = "=0.9.3", features = ["fast"] }
lamquant-lml-mcu = { git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "1c377f2afe8c3f13ebd6c1c4421bf78a2c2877e5", version = "=0.9.3", default-features = false, features = ["std"] }
lamquant-lml-archive = { package = "lamquant-lml", git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "1c377f2afe8c3f13ebd6c1c4421bf78a2c2877e5", version = "=0.9.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
