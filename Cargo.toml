[workspace]
resolver = "2"
members = ["crates/lamquant-legacy-adapter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"

[workspace.dependencies]
blake3 = "=1.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
