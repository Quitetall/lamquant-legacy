[workspace]
resolver = "2"
members = [
    "crates/lamquant-abir-bridge",
    "crates/lamquant-legacy-adapter",
    "crates/lamquant-legacy-ir",
    "crates/lamquant-lml-legacy",
    "crates/lamquant-lma-training-legacy",
    "crates/lamquant-op-event-legacy",
    "crates/lamquant-stage-pass-legacy",
    "crates/lamquant-runtime-legacy",
]
# The ABIR bridge is experimental (ADR 0139/0140): in `members` so it shares the
# lock + is fmt/clippy/test-gated by semantic-core, but OUT of `default-members`
# so a bare `cargo build` never pulls it into production.
default-members = [
    "crates/lamquant-legacy-adapter",
    "crates/lamquant-legacy-ir",
    "crates/lamquant-lml-legacy",
    "crates/lamquant-lma-training-legacy",
    "crates/lamquant-op-event-legacy",
    "crates/lamquant-stage-pass-legacy",
    "crates/lamquant-runtime-legacy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/lamquant-legacy"

[workspace.dependencies]
abir = { git = "https://github.com/Quitetall/ABIR.git", rev = "4eec3689abd67b2e9bc1117ea246a1fbb919e4b0", version = "=0.1.0" }
abir-adapter = { git = "https://github.com/Quitetall/ABIR.git", rev = "4eec3689abd67b2e9bc1117ea246a1fbb919e4b0", version = "=0.1.0" }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
blake3 = { version = "=1.5.5", default-features = false }
bytemuck = "=1.25.0"
lamquant-legacy-ir = { path = "crates/lamquant-legacy-ir", version = "=0.1.1" }
lamquant-lml-legacy = { path = "crates/lamquant-lml-legacy", version = "=0.1.1", default-features = false, features = ["legacy-decode", "legacy-encode", "legacy-tensor-pack"] }
lamquant-lml-desktop = { git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "cba89ca46f382588806459500fb3212b306c81ac", version = "=0.9.3", features = ["fast"] }
lamquant-lml-mcu = { git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "cba89ca46f382588806459500fb3212b306c81ac", version = "=0.9.3", default-features = false, features = ["std"] }
lamquant-lml-archive = { package = "lamquant-lml", git = "https://github.com/Quitetall/LamQuant-Lossless.git", rev = "cba89ca46f382588806459500fb3212b306c81ac", version = "=0.9.3", default-features = false, features = ["std", "archive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tempfile = "3"
libc = "0.2"
